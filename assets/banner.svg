<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420" style="background:#0b132b;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;border-radius:12px;overflow:hidden"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b132b"/><stop offset="50%" stop-color="#1c2541"/><stop offset="100%" stop-color="#090a0f"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#64dfdf"/><stop offset="50%" stop-color="#48bfe3"/><stop offset="100%" stop-color="#5390d9"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7209b7"/><stop offset="100%" stop-color="#4361ee"/></linearGradient><linearGradient id="radarGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#48bfe3" stop-opacity=".4"/><stop offset="100%" stop-color="#48bfe3" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes gridFlow{0%{transform:translateY(0)}}@keyframes radarRotate{0%{transform:rotate(0deg)}}@keyframes pulseNode{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.6);opacity:.9}}@keyframes floatPlane{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}@keyframes dashMove{0%{stroke-dashoffset:100}}.grid-line{stroke:#48bfe3;stroke-opacity:.07;stroke-width:1}.radar-sweep{transform-origin:980px 210px;animation:radarRotate 12s linear infinite}.floating-plane{animation:floatPlane 6s ease-in-out infinite}.pulsing-dot-1{transform-origin:980px 130px;animation:pulseNode 3s ease-in-out infinite}.pulsing-dot-2{transform-origin:1060px 250px;animation:pulseNode 4s ease-in-out infinite 1s}.pulsing-dot-3{transform-origin:880px 270px;animation:pulseNode 3.5s ease-in-out infinite 2s}.flow-line{stroke-dasharray:8 8;animation:dashMove 4s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><g class="background-grid"><line x1="0" x2="1200" y1="70" y2="70" class="grid-line"/><line x1="0" x2="1200" y1="140" y2="140" class="grid-line"/><line x1="0" x2="1200" y1="210" y2="210" class="grid-line"/><line x1="0" x2="1200" y1="280" y2="280" class="grid-line"/><line x1="0" x2="1200" y1="350" y2="350" class="grid-line"/><line x1="150" x2="150" y1="0" y2="420" class="grid-line"/><line x1="300" x2="300" y1="0" y2="420" class="grid-line"/><line x1="450" x2="450" y1="0" y2="420" class="grid-line"/><line x1="600" x2="600" y1="0" y2="420" class="grid-line"/><line x1="750" x2="750" y1="0" y2="420" class="grid-line"/><line x1="900" x2="900" y1="0" y2="420" class="grid-line"/><line x1="1050" x2="1050" y1="0" y2="420" class="grid-line"/></g><g opacity=".85" transform="translate(0,0)"><circle cx="980" cy="210" r="160" fill="none" stroke="#48bfe3" stroke-opacity=".15" stroke-width="1.5"/><circle cx="980" cy="210" r="110" fill="none" stroke="#48bfe3" stroke-dasharray="4 4" stroke-opacity=".25" stroke-width="1.5"/><circle cx="980" cy="210" r="60" fill="none" stroke="#48bfe3" stroke-opacity=".35" stroke-width="1.5"/><path fill="url(#radarGrad)" d="M 980 210 L 1140 210 A 160 160 0 0 0 980 50 Z" class="radar-sweep"/><path fill="none" stroke="#64dfdf" stroke-opacity=".5" stroke-width="2" d="M 880 270 L 980 130 L 1060 250 Z" class="flow-line"/><circle cx="980" cy="130" r="10" fill="#64dfdf" class="pulsing-dot-1"/><circle cx="980" cy="130" r="5" fill="#fff" filter="url(#softGlow)"/><circle cx="1060" cy="250" r="10" fill="#7209b7" class="pulsing-dot-2"/><circle cx="1060" cy="250" r="5" fill="#fff" filter="url(#softGlow)"/><circle cx="880" cy="270" r="10" fill="#48bfe3" class="pulsing-dot-3"/><circle cx="880" cy="270" r="5" fill="#fff" filter="url(#softGlow)"/><g class="floating-plane"><path fill="url(#textGrad)" d="M40 0 L52 25 L80 32 L52 38 L44 55 L36 40 L10 38 L30 25 Z" filter="url(#softGlow)" opacity=".9" transform="translate(940, 175)"/></g></g><g transform="translate(70, 75)"><rect width="130" height="28" x="0" y="0" fill="#1c2541" stroke="#64dfdf" stroke-opacity=".4" stroke-width="1.2" rx="14"/><text x="65" y="18" fill="#64dfdf" font-size="12" font-weight="600" text-anchor="middle">✈️ AVIATION MRO</text><rect width="120" height="28" x="145" y="0" fill="#1c2541" stroke="#48bfe3" stroke-opacity=".4" stroke-width="1.2" rx="14"/><text x="205" y="18" fill="#48bfe3" font-size="12" font-weight="600" text-anchor="middle">🛡️ AIRWORTHINESS</text><rect width="110" height="28" x="280" y="0" fill="#1c2541" stroke="#5390d9" stroke-opacity=".4" stroke-width="1.2" rx="14"/><text x="335" y="18" fill="#5390d9" font-size="12" font-weight="600" text-anchor="middle">⚙️ CAMO &amp; FLEET</text></g><g><text x="0" y="45" fill="url(#textGrad)" filter="url(#glow)" font-size="44" font-weight="800" letter-spacing=".5" transform="translate(70, 160)">Awesome Aircraft Maintenance</text><text x="0" y="95" fill="#fff" filter="url(#softGlow)" font-size="40" font-weight="800" letter-spacing=".5" transform="translate(70, 160)">Management Directory 🛠️</text><text x="0" y="142" fill="#e0e1dd" font-size="17" font-weight="400" opacity=".95" transform="translate(70, 160)">Curated ecosystem of SaaS enterprise platforms &amp; open-source projects for airlines, MROs, &amp; GA fleets.</text><text x="0" y="170" fill="#48bfe3" font-size="14" font-weight="500" opacity=".9" transform="translate(70, 160)">Tracking Airworthiness Directives (AD/SB) • Work Orders • Component Lifecycles • FAA / EASA Part 145 Compliance</text></g><rect width="1200" height="6" x="0" y="414" fill="url(#textGrad)"/></svg>