<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#0b132b; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Background & Glowing Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64dfdf"/>
      <stop offset="50%" stop-color="#48bfe3"/>
      <stop offset="100%" stop-color="#5390d9"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48bfe3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#48bfe3" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes gridFlow {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    @keyframes radarRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.6); opacity: 0.9; }
    }

    @keyframes floatPlane {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }

    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .grid-line { stroke: #48bfe3; stroke-opacity: 0.07; stroke-width: 1; }
    .radar-sweep { transform-origin: 980px 210px; animation: radarRotate 12s linear infinite; }
    .floating-plane { animation: floatPlane 6s ease-in-out infinite; }
    .pulsing-dot-1 { transform-origin: 980px 130px; animation: pulseNode 3s ease-in-out infinite; }
    .pulsing-dot-2 { transform-origin: 1060px 250px; animation: pulseNode 4s ease-in-out infinite 1s; }
    .pulsing-dot-3 { transform-origin: 880px 270px; animation: pulseNode 3.5s ease-in-out infinite 2s; }
    .flow-line { stroke-dasharray: 8 8; animation: dashMove 4s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Background Grid -->
  <g class="background-grid">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Right Side Decorative Aircraft Maintenance Radar & Dynamic Nodes -->
  <g transform="translate(0,0)" opacity="0.85">
    <!-- Radar Circles -->
    <circle cx="980" cy="210" r="160" stroke="#48bfe3" stroke-opacity="0.15" fill="none" stroke-width="1.5"/>
    <circle cx="980" cy="210" r="110" stroke="#48bfe3" stroke-opacity="0.25" fill="none" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="980" cy="210" r="60" stroke="#48bfe3" stroke-opacity="0.35" fill="none" stroke-width="1.5"/>

    <!-- Radar Sweep Beam -->
    <path class="radar-sweep" d="M 980 210 L 1140 210 A 160 160 0 0 0 980 50 Z" fill="url(#radarGrad)" />

    <!-- Connected Maintenance Workflow Paths -->
    <path class="flow-line" d="M 880 270 L 980 130 L 1060 250 Z" stroke="#64dfdf" stroke-opacity="0.5" stroke-width="2" fill="none"/>

    <!-- Pulsing Node Markers -->
    <circle class="pulsing-dot-1" cx="980" cy="130" r="10" fill="#64dfdf" />
    <circle cx="980" cy="130" r="5" fill="#ffffff" filter="url(#softGlow)"/>

    <circle class="pulsing-dot-2" cx="1060" cy="250" r="10" fill="#7209b7" />
    <circle cx="1060" cy="250" r="5" fill="#ffffff" filter="url(#softGlow)"/>

    <circle class="pulsing-dot-3" cx="880" cy="270" r="10" fill="#48bfe3" />
    <circle cx="880" cy="270" r="5" fill="#ffffff" filter="url(#softGlow)"/>

    <!-- Floating Stylized Jet Silhouette -->
    <g class="floating-plane" transform="translate(940, 175)">
      <path d="M40 0 L52 25 L80 32 L52 38 L44 55 L36 40 L10 38 L30 25 Z" fill="url(#textGrad)" opacity="0.9" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Left Side Badges / Tech Pills (Background Accent) -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1c2541" stroke="#64dfdf" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="65" y="18" fill="#64dfdf" font-size="12" font-weight="600" text-anchor="middle">✈️ AVIATION MRO</text>

    <rect x="145" y="0" width="120" height="28" rx="14" fill="#1c2541" stroke="#48bfe3" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="205" y="18" fill="#48bfe3" font-size="12" font-weight="600" text-anchor="middle">🛡️ AIRWORTHINESS</text>

    <rect x="280" y="0" width="110" height="28" rx="14" fill="#1c2541" stroke="#5390d9" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="335" y="18" fill="#5390d9" font-size="12" font-weight="600" text-anchor="middle">⚙️ CAMO &amp; FLEET</text>
  </g>

  <!-- FOREGROUND TEXT (Clear, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(70, 160)">
    <!-- Main Title -->
    <text x="0" y="45" font-size="44" font-weight="800" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="0.5">
      Awesome Aircraft Maintenance
    </text>
    <text x="0" y="95" font-size="40" font-weight="800" fill="#ffffff" filter="url(#softGlow)" letter-spacing="0.5">
      Management Directory 🛠️
    </text>

    <!-- Subtitle -->
    <text x="0" y="142" font-size="17" font-weight="400" fill="#e0e1dd" opacity="0.95">
      Curated ecosystem of SaaS enterprise platforms &amp; open-source projects for airlines, MROs, &amp; GA fleets.
    </text>
    <text x="0" y="170" font-size="14" font-weight="500" fill="#48bfe3" opacity="0.9">
      Tracking Airworthiness Directives (AD/SB) • Work Orders • Component Lifecycles • FAA / EASA Part 145 Compliance
    </text>
  </g>

  <!-- Bottom Decorative Border Line -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#textGrad)"/>
</svg>
